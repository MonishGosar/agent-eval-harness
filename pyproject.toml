[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Project-agnostic evaluation harness for AI agents, built on DeepEval."
readme = "README.md"
license = "MIT"
authors = [{ name = "Monish Gosar" }]
requires-python = ">=3.11"
keywords = ["deepeval", "llm", "agents", "evaluation", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "deepeval>=3.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]
openai-agents = [
    "openai-agents>=0.0.15",
]

[project.scripts]
agent-eval = "agent_eval.cli:console"

[project.urls]
Homepage = "https://github.com/monishgosar/agent-eval-harness"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent_eval"

[dependency-groups]
dev = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "openai-agents>=0.0.15",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter owns wrapping. Prompt text and report templates stay readable.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
